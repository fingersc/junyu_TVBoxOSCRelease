name: Test

on:
  #schedule:
  #  - cron: 59 */23 * * *
  workflow_dispatch:
    inputs:
      rebuild:
        description: '忽略构建记录以重新构建'
        required: false
        type: boolean
      donotpublish:
        description: '构建后不提交发布新版'
        required: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - userName: fingersc
            repoName: TVBoxOS
            branchName: main
            java_ver: 17
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check New Commit
        run: |
          upStream=https://github.com/${{ matrix.userName }}/${{ matrix.repoName }}
          echo "upStream=$upStream" >> $GITHUB_ENV
          commit=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ matrix.userName }}/${{ matrix.repoName }}/commits/${{ matrix.branchName }}" \
            | jq -r '.sha // empty')
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::无法获取最新 commit（API 限流或网络问题），本次跳过构建"
            echo "commit=" >> $GITHUB_ENV
            exit 0
          fi
          if ! grep -q "$commit" README.md || [ "${{ inputs.rebuild }}" == "true" ]; then
            echo "commit=$commit" >> $GITHUB_ENV
            echo "commitS=${commit:0:7}" >> $GITHUB_ENV
          fi
          echo "commit=$commit"
      - name: Checkout Source Code
        if: ${{ env.commit }}
        run: |
          git clone ${{ env.upStream }} TVBoxOSC
          cd TVBoxOSC
          git checkout ${{ env.commit }}
          echo "tag=$(git log --date=format:'%Y%m%d-%H%M' --pretty=format:%cd ${{ env.commitS }} -1)" >> $GITHUB_ENV
      - name: Extra Modify
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          echo '修改VersionName'
          if [ "${{ matrix.userName }}" == "takagen99" ]; then
            # 进行 sed 修改
            sed -i 's/\.concat(buildTime())/ +\"${{ env.tag }}\"/g' app/build.gradle 
            # 目前关于页面没有合并我的分支
            sed -i "/android:text=/s#=\"#=\"${{ env.tag }}\\\\n\\\\n#" app/src/main/res/layout/dialog_about.xml
          else
             sed -i "/versionName/s#[0-9a-zA-Z_\.\'\"-]\+\$#\'${{ env.tag }}\'#" app/build.gradle
             sed -i "/android:text=/s#=\"#=\"${{ env.tag }}\\\\n\\\\n#" app/src/main/res/layout/dialog_about.xml
          fi 
          echo 'crosswalk源，防挂'
          if grep -q 'crosswalk' build.gradle; then
            sed -i "/crosswalk/a\        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          else
            sed -i "/jitpack.io/a\        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          fi
          echo '递增VersionCode —— 覆盖安装必需'
          # 上游源码把 versionCode 写死成 1，而这里只改 versionName（tag 日期串），
          # 于是每次构建出来的 APK 版本号完全相同。小米盒子 / 小米电视的安装器
          # 在 versionCode 没有递增时会直接拒绝覆盖安装（表现为「应用未安装」或
          # 必须先卸载旧版）。这里用「提交时间戳 / 10」当版本号：
          #   · 上游一更新，提交时间就变新，版本号严格单调递增；
          #   · 同一 commit 重跑（rebuild）版本号保持不变，便于复现；
          #   · versionCode 上限是 2147483647，时间戳/10 约 1.8 亿，远在上限内。
          #     （千万别写成 yyMMddHHmm —— 那是 26 亿，超 int 上限，AGP 直接报错。）
          CT=$(git log --pretty=format:%ct ${{ env.commitS }} -1 2>/dev/null)
          if ! [[ "$CT" =~ ^[0-9]+$ ]]; then
            # 取不到提交时间时兜底用当前时间，绝不留下空的 versionCode
            CT=$(date +%s)
          fi
          VC=$(( CT / 10 ))
          echo "versionCode=$VC (commitTime=$CT)"
          sed -i "s/\bversionCode[[:space:]]\+[0-9]\+/versionCode $VC/" app/build.gradle
          grep -n 'versionCode' app/build.gradle || true
      - name: Compress Source Code
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          #zip -q -x ".git/*" -x  ".github/*" -r sourceCode-${{ env.commitS }}.zip .
          tar -cJf sourceCode-${{ env.commitS }}.tar.xz --exclude=.git --exclude=.github *
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Modify pyramid——build.gradle
        working-directory: TVBoxOSC
        run: |
          # 替换Windows路径为系统Python路径
          sed -i '/buildPython("D:\/Programs\/Python\/Python38\/python.exe")/d' pyramid/build.gradle
          sed -i '$ s/^#//' ./gradle.properties
          # ★ Chaquo 索引抖动加固（v99-r12）：
          #   故障链：chaquo.com/pypi-7.0 索引页读超时 ⇒ pip 抓不到 lxml 的
          #   android native wheel ⇒ 回落到 pypi 只剩 lxml-6.1.3 源码包 ⇒
          #   Chaquopy 12 自带 pip 19.2.3 的 vendored pytoml 解析新版
          #   pyproject.toml 必然 TomlError ⇒ :pyramid:generatePython...FAILED。
          #   对策：把 pip 的 timeout/retries 调大。必须走 pip options —— Chaquopy
          #   调 pip 时带 --isolated 且 PIP_CONFIG_FILE=os.devnull，环境变量
          #   PIP_TIMEOUT/PIP_RETRIES 会被完全屏蔽。
          #   ⚠ 绝不能注入 --index-url / -i：Chaquopy 一旦检测到用户显式指定
          #     --index-url 就会禁用自己的仓库（chaquo.com/pypi-7.0），
          #     android wheel 反而全丢，问题更严重。
          sed -i 's/^\( *\)pip {$/\1pip {\n\1    options "--timeout", "60", "--retries", "10"/' pyramid/build.gradle
          echo '--- pip block after patch ---'
          grep -n -A3 'pip {' pyramid/build.gradle || true

      - name: Setup Python local.properties
        working-directory: TVBoxOSC
        run: echo "" > local.properties    
        
      - name: Release Apk Sign
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          signingConfigs=''
          signingConfig='ICAgICAgICAgICAgaWYgKHByb2plY3QuaGFzUHJvcGVydHkoIlJFTEVBU0VfU1RPUkVfRklMRSIpKSB7XAogICAgICAgICAgICAgICAgc2lnbmluZ0NvbmZpZyBzaWduaW5nQ29uZmlncy5teUNvbmZpZ1wKICAgICAgICAgICAgfVwK'
          signingConfigs="$(echo "$signingConfigs" |base64 -d )"
          signingConfig="$(echo "$signingConfig" |base64 -d )"
          sed -i -e "/defaultConfig {/i\\$signingConfigs " -e "/debug {/a\\$signingConfig " -e "/release {/a\\$signingConfig " app/build.gradle
          cp -f ${{ github.workspace }}/.github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks
          sed -i '$a\RELEASE_STORE_FILE=./TVBoxOSC.jks'     ./gradle.properties
          sed -i '$a\RELEASE_KEY_ALIAS=TVBoxOSC'            ./gradle.properties
          sed -i '$a\RELEASE_STORE_PASSWORD=TVBoxOSC'       ./gradle.properties
          sed -i '$a\RELEASE_KEY_PASSWORD=TVBoxOSC'         ./gradle.properties
      - uses: actions/setup-java@v4
        if: ${{ matrix.java_ver }}
        with:
          distribution: temurin
          java-version: ${{ matrix.java_ver }}
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ env.commit }}
      - name: Precheck Chaquo Pip Index
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          # ChaquoPy 的 android wheel 只在 https://chaquo.com/pypi-7.0 提供。
          # 该站偶尔读超时，一旦超时 pip 就只剩 pypi 的 lxml 源码包，
          # 而 pip 19.2.3 的 vendored pytoml 解析新版 pyproject.toml 必然失败
          # ⇒ :pyramid:generatePython64ReleasePythonRequirements FAILED。
          # 这里先探一次，给抖动留出恢复窗口；探不通也不阻断（构建里
          # 已把 pip timeout/retries 放宽，且外层还有整体重试）。
          for i in $(seq 1 20); do
            if curl -fsS --max-time 20 -o /dev/null https://chaquo.com/pypi-7.0/lxml/; then
              echo "chaquo pip index reachable (try $i)"
              exit 0
            fi
            echo "chaquo pip index unreachable (try $i/20), wait 15s..."
            sleep 15
          done
          echo "::warning::chaquo pip index still unreachable, continue anyway"

      - name: Build With Gradle
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          chmod +x gradlew
          #只保留64位安装包./gradlew assemblerelease --build-cache --parallel --daemon --warning-mode all
          # pip 依赖下载是纯网络动作，Chaquo 索引偶发抖动就会让整个构建挂掉。
          # 这里做有限次整体重试：失败后等 30s 再来一次，最多 3 次。
          for i in 1 2 3; do
            if ./gradlew assembleJava64Release assemblePython64Release --build-cache --parallel --daemon --warning-mode all; then
              echo "gradle build succeeded (attempt $i)"
              exit 0
            fi
            echo "::warning::gradle build failed (attempt $i), retry in 30s"
            sleep 30
          done
          echo "::error::gradle build failed after 3 attempts"
          exit 1
      - name: Prepare App
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          rm -rf apk/
          mkdir -p apk/
          for file in `find ~ -name "*release*.apk" -print`; do
            # 获取文件的基本名称
            base=$(basename "$file")
            # 如果文件是 TVBox_ 开头
            if [[ "$base" == TVBox_* ]]; then
              new_base=$(echo "$base" | sed "s/release/${{ matrix.userName }}_${{ env.tag }}/")
            else
              new_base="TVBox_${{ matrix.userName }}_${{ env.tag }}.apk"
            fi
            # 移动并重命名文件
            mv "$file" "apk/$new_base"
          done
          mv sourceCode-${{ env.commitS }}.* apk/
      - name: Show Apk Version And Signature
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          # 排查「每次都要先卸载才能装」的两条线索，直接打到运行日志里：
          #   1) versionCode 是否递增（小米设备安装器据此决定是否允许覆盖）
          #   2) 签名指纹是否每次一致（不一致则必然只能卸载重装）
          for f in apk/*.apk; do
            echo "== $(basename "$f")"
            unzip -p "$f" AndroidManifest.xml >/dev/null 2>&1 || true
            keytool -printcert -jarfile "$f" 2>/dev/null | grep -E 'Owner|SHA1|SHA256' || echo '  (签名读取失败)'
          done
      - name: Release Note
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          lastCommit=$(grep "${{ matrix.userName }}\/${{ matrix.repoName }}" ${{ github.workspace }}/README.md |grep -o '[a-z0-9]\{40\}')
          export LESSCHARSET=utf-8
          echo -e "Credit: [${{ matrix.userName }}](${{ env.upStream }})\nCommit: ${{ env.commit }}\nChangelog:\n\`\`\`" > apk/${{ matrix.userName }}-Release.log
          if [ "${{ env.commit }}" == "${lastCommit}" ]; then
            git log --pretty=format:%B ${{ env.commitS }} -1 |sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' |cat -n |sort -k2,2 -k1,1n |uniq -f1 |sort -k1,1n |cut -f2- >> apk/${{ matrix.userName }}-Release.log
          else
            git log --pretty=format:%B ${{ env.commitS }}...${lastCommit:0:7} |sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' |cat -n |sort -k2,2 -k1,1n |uniq -f1 |sort -k1,1n |cut -f2- >> apk/${{ matrix.userName }}-Release.log
          fi
          echo -e '\n```' >> apk/${{ matrix.userName }}-Release.log
      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        # v4 的 finalize 偶发 404（服务端抖动 / 同一 run 重跑时旧 artifact 被删），
        # 只影响构建产物留存，不该因此让后面已经能发的 APK 发不出去。
        continue-on-error: true
        if: ${{ env.commit }}
        with:
          name: ${{ matrix.userName }}-${{ matrix.repoName }}
          path: |
            TVBoxOSC/apk/*
          # 重跑时覆盖同名 artifact，避免残留记录导致冲突
          overwrite: true
          retention-days: 3
      - name: Whether Or Not to Publish
        if: ${{ inputs.donotpublish && env.commit }}
        run: |
          echo "commit=" >> $GITHUB_ENV
      - name: Release and Upload Assets
        uses: ncipollo/release-action@v1
        if: ${{ env.commit }}
        with:
          name: ${{ env.tag }}
          tag: ${{ env.tag }}
          bodyFile: TVBoxOSC/apk/${{ matrix.userName }}-Release.log
          allowUpdates: true
          removeArtifacts: true
          artifacts: |
            TVBoxOSC/apk/*.apk
            TVBoxOSC/apk/sourceCode-${{ env.commitS }}.*
      - name: Push to master
        if: ${{ env.commit }}
        run: |
          rm -rf TVBoxOSC
          git reset --hard
          sed -i '/url =/d' ./.git/config
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url --add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git pull --rebase
          sed -i "/${{ matrix.userName }}\/${{ matrix.repoName }}/s#Updated: [a-zA-Z0-9]*#Updated: ${{ env.commit }}#" README.md
          git add --all
          git commit -m "${{ env.commit }}"
          git push -u -f origin master

  clean:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete older workflow runs and artifacts
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 10
